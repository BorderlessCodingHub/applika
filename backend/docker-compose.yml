services:
  backend:
    build: .
    container_name: applika.dev-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend-environment
      - ENVIRONMENT=DEV
      - CORS_ORIGINS=["http://127.0.0.1:8080"]
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/applika
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-http://127.0.0.1:8000/api/auth/github/callback}
      # Borderless sign-in (ADR-0024): 503 until both are set.
      - BORDERLESS_API_URL=${BORDERLESS_API_URL:-}
      - BORDERLESS_TOKEN_ENCRYPTION_KEY=${BORDERLESS_TOKEN_ENCRYPTION_KEY:-}
      - WEB_SIGNIN_URI=${WEB_SIGNIN_URI:-http://127.0.0.1:8080/login}
      - LOGIN_REDIRECT_URI=${LOGIN_REDIRECT_URI:-http://127.0.0.1:8080/dashboard}
      - DISCORD_FEEDBACK_WEBHOOK=${DISCORD_FEEDBACK_WEBHOOK:-}
    ports:
      - "8000:8000"
    entrypoint:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000",
      ]
    healthcheck:
      # openapi.json exists in every non-PROD environment and proves the app
      # booted AFTER the migration ran; the worker and scheduler wait on it.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json')"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # ADR-0016: the taskiq worker and its single scheduler run the same image
  # with the api's settings. They start once the api is healthy, i.e. after
  # its migration ran, and never run Alembic themselves.
  worker:
    build: .
    container_name: applika.dev-worker
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-environment
    command: ["taskiq", "worker", "app.worker.broker:broker", "app.worker.tasks"]
    restart: unless-stopped

  scheduler:
    build: .
    container_name: applika.dev-scheduler
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-environment
    # Exactly one scheduler: it enqueues `ingest_jobs` on JOBS_INGEST_CRON.
    command: ["taskiq", "scheduler", "app.worker.broker:scheduler", "app.worker.tasks"]
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: applika.dev-postgres
    environment:
      POSTGRES_DB: applika
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - applika_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: applika.dev-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - applika_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  applika_db_data:
  applika_redis_data:
