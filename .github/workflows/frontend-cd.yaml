name: Frontend CD

on:
  workflow_dispatch:
  push:
    branches:
      - actions/*
      - main
    paths:
      - "frontend/**"

# One run at a time: a second push waits instead of racing the first one's
# push, cleanup and deploy on the same `latest` tag.
concurrency:
  group: frontend-cd
  cancel-in-progress: false

env:
  IMAGE_NAME: applika

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # GHCR refuses upper-case repository names and the owner is
      # BorderlessCodingHub.
      - name: Resolve image reference
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # provenance/sbom off: they push extra untagged manifests that the
      # `latest` index points at, which the cleanup below would delete.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/docker/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REF }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            API_BASE_URL=${{ vars.API_BASE_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Only `latest` is kept: every push leaves the previous image untagged,
      # and untagged versions still count against the package storage quota.
      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: 0

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Coolify pulls `latest` again and restarts the resource.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_UUIDS: ${{ vars.COOLIFY_FRONTEND_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_UUIDS}&force=false"
