[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "applika-cli"
version = "0.1.0"
description = "CLI for Applika"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
applika = "main:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.hatch.build.targets.wheel]
only-include = ["src"]

[tool.hatch.build.targets.wheel.sources]
src = ""
